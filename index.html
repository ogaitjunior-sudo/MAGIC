<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Magic Effects Showcase, um laboratorio interativo de animacoes e efeitos visuais."
    />
    <meta name="theme-color" content="#1f1830" />
    <title>Magic Effects Showcase</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #171123;
        color: #fffdfd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(98, 222, 169, 0.24), transparent 28rem),
          radial-gradient(circle at 80% 15%, rgba(196, 125, 255, 0.22), transparent 24rem),
          radial-gradient(circle at 50% 100%, rgba(255, 219, 109, 0.16), transparent 26rem), #171123;
      }

      main {
        width: min(92vw, 42rem);
        padding: 3rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        background: rgba(29, 22, 44, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(18px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #ffdd72;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 1rem auto 0;
        max-width: 32rem;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 1.5rem;
        padding: 0 1rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #c77dff, #62dea9, #ffdd72);
        color: #1b1429;
        font-size: 0.9rem;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Interactive animation laboratory</p>
      <h1>Magic Effects Showcase</h1>
      <p>
        Este arquivo existe como fallback HTML. Para abrir a aplicacao completa, rode o servidor do
        projeto com <strong>npm run dev</strong>.
      </p>
      <a href="/">Abrir aplicacao</a>
    </main>
  </body>
</html>
